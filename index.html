    .manage-long{height:24px;padding:0 7px;border:1px solid #b8d9cc;border-radius:6px;color:var(--green);background:#fff;font-size:8px;font-weight:750}.manager-list{display:grid;gap:8px;max-height:min(60vh,520px);overflow-y:auto}.manager-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe}.manager-row strong{display:block;font-size:12px;line-height:1.4}.manager-meta{display:block;margin-top:4px;color:var(--muted);font-size:9px;line-height:1.5}.manager-status{display:inline-block;margin-right:5px;padding:2px 5px;border-radius:5px;color:var(--green);background:var(--green-soft);font-size:8px;font-weight:800}.manager-actions{display:flex;align-items:center;gap:5px}.manager-actions button{height:29px;padding:0 8px;border:1px solid var(--line);border-radius:7px;color:var(--ink);background:#fff;font-size:9px;font-weight:700}.manager-actions button:hover{border-color:var(--green);color:var(--green)}.manager-empty{padding:30px;color:var(--muted);font-size:11px;text-align:center}.convert-copy{margin:-8px 0 15px;color:var(--muted);font-size:11px;line-height:1.45}.convert-options{display:grid;gap:8px}.convert-choice{display:grid;grid-template-columns:18px 1fr;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fafbfe}.convert-choice:has(input:checked){border-color:var(--green);background:var(--green-soft)}.convert-choice input{margin:2px 0 0;accent-color:var(--green)}.convert-choice strong{display:block;font-size:12px}.convert-choice span{display:block;margin-top:2px;color:var(--muted);font-size:10px}.convert-target{width:100%;height:38px;margin-top:10px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:#fff}.convert-target:disabled{opacity:.5}.convert-error{min-height:16px;margin:7px 0 0;color:var(--red);font-size:10px}[data-scope=long]{--scope:var(--green);--scope-soft:var(--green-soft)}[data-scope=daily]{--scope:var(--blue);--scope-soft:va <body>
  <main class="page">
    <header class="topbar"><div><p class="eyebrow">Work calendar</p><h1>工作日历</h1><p class="subtitle">四类任务分开管理，All 汇总查看；历史记录从 2026/10/08 起可回溯。</p></div><div class="header-actions"><button class="button" id="exportCsv" type="button">导出本月 CSV</button><button class="button" id="exportJson" type="button">备份全部 JSON</button><button class="button" id="importJson" type="button">导入 JSON</button><input id="importJsonInput" type="file" accept="application/json,.json" hidden><button class="button primary" id="printCalendar" type="button">打印 / PDF</button></div></header>
    <section class="summary-grid" id="summaryGrid" aria-label="当日任务概览"></section>
    <section class="toolbar"><nav class="tabs" id="tabs" aria-label="任务分类"><button class="tab active" type="button" data-filter="all">All</button><button class="tab" type="button" data-filter="long">长期做</button><button class="tab" type="button" data-filter="daily">当天做</button><button class="tab" type="button" data-filter="weekly">每周做</button><button class="tab" type="button" data-filter="today">任务和收获</button></nav><div class="date-jump"><button id="prevDay" type="button" title="前一天">←</button><input id="datePicker" type="date" min="2026-10-08" aria-label="选择日期"><button class="today" id="goToday" type="button">今天</button><button id="nextDay" type="button" title="后一天">→</button></div></section>
    <section class="dashboard">
      <article class="calendar-card"><div class="calendar-head"><div class="calendar-title"><h2 id="monthTitle"></h2><p>仅显示周一至周五；点击日期，在右侧查看和编辑当天任务</p></div><div class="month-nav"><button id="prevMonth" type="button" aria-label="上个月">‹</button><button id="nextMonth" type="button" aria-label="下个月">›</button></div></div><div class="weekdays"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span></div><div class="calendar-grid" id="calendarGrid"></div></article>
      <aside class="day-panel"><div class="panel-head"><h2 id="selectedDateTitle"></h2><p id="selectedDateMeta"></p></div><div class="panel-body" id="dayPanelBody"></div><form class="add-box" id="addTaskForm"><select class="long-target-select" id="longTargetSelect" aria-label="选择已有长期任务" hidden></select><div class="add-row"><select id="addScope" aria-label="任务分类"><option value="long">长期做</option><option value="daily">当天做</option><option value="weekly">每周做</option><option value="today">任务和收获</option></select><input id="newTaskTitle" maxlength="100" placeholder="添加一项任务…" autocomplete="off" required><button id="addTaskButton" type="submit">添加</button></div><input class="new-task-note-input" id="newTaskNote" maxlength="160" placeholder="一句话总结 / 描述（选填）" autocomplete="off" hidden><p class="storage-note">自动保存在当前浏览器；建议定期“备份全部 JSON”。</p></form></aside>
    </section>
  </main>
  <dialog id="editDialog"><form class="edit-form" id="editForm"><h3>编辑任务</h3><label class="field">任务名称<input id="editTitle" maxlength="100" required></label><label class="field">补充说明（选填）<input id="editNote" maxlength="240"></label><div id="longRangeFields"><span class="periods-label">活动时间段（可添加多段）</span><div class="periods-editor" id="periodsEditor"></div><button class="add-period" id="addPeriod" type="button">＋ 添加时间段</button></div><div id="weeklyDayFields"><span class="periods-label">每周执行日</span><div class="weekday-options"><label class="weekday-option"><input type="checkbox" value="1">周一</label><label class="weekday-option"><input type="checkbox" value="2">周二</label><label class="weekday-option"><input type="checkbox" value="3">周三</label><label class="weekday-option"><input type="checkbox" value="4">周四</label><label class="weekday-option"><input type="checkbox" value="5">周五</label></div><p class="weekday-hint">可多选；不勾选则整周工作日均显示。</p></div><p class="dialog-error" id="editError"></p><div class="dialog-actions"><button class="cancel" id="cancelEdit" type="button">取消</button><button class="save" type="submit">保存修改</button></div></form></dialog>
  <dialog id="convertDialog"><form class="edit-form" id="convertForm"><h3>转为长期任务</h3><p class="convert-copy" id="convertTaskCopy"></p><div class="convert-options"><label class="convert-choice"><input type="radio" name="convertMode" value="new" checked><span><strong>新建长期任务</strong><span>单独创建，并从当前日期开始记录。</span></span></label><label class="convert-choice"><input id="joinExistingRadio" type="radio" name="convertMode" value="existing"><span><strong>加入已有长期任务</strong><span>作为当天的一条进展写入已有时间轴，不再单列。</span></span></label></div><select class="convert-target" id="convertTarget" disabled aria-label="选择已有长期任务"></select><p class="convert-error" id="convertError"></p><div class="dialog-actions"><button class="cancel" id="cancelConvert" type="button">取消</button><button class="save" type="submit">确认转换</button></div></form></dialog>
  <dialog id="longManagerDialog"><div class="edit-form"><h3 id="managerTitle">全部任务</h3><p class="convert-copy" id="managerCopy"></p><div class="manager-list" id="longManagerList"></div><div class="dialog-actions"><button class="cancel" id="closeLongManager" type="button">关闭</button></div></div></dialog>
  <script>
    const dailyDefaults=[];
    const weeklyDefaults=[];
    const makeId=()=>globalThis.crypto?.randomUUID?.()||`task-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    const defaultRecent=[];
    const storagePrefix="work-checklist-v1",earliestKey="2026-10-08",earliestDate=fromDateKey(earliestKey),scopes=["long","daily","weekly","today"];

    function openEditor(s,id){const task=getTaskCollection(s,selectedDate).find(t=>t.id===id);if(!task)return;editingTarget={scope:s,id,dateKey:toDateKey(selectedDate)};document.querySelector("#editTitle").value=task.title;document.querySelector("#editNote").value=task.note||"";document.querySelector("#longRangeFields").hidden=s!=="long";document.querySelector("#weeklyDayFields").hidden=s!=="weekly";if(s==="long")renderPeriodEditor(task.periods);if(s==="weekly")document.querySelectorAll("#weeklyDayFields input").forEach(input=>{input.checked=task.weekdays.includes(Number(input.value))});document.querySelector("#editError").textContent="";editDialog.showModal();document.querySelector("#editTitle").focus()}
    function csvCell(v){return`"${String(v??"").replaceAll('"','""')}"`}function downloadFile(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
    function exportLongTimeline(id){const task=getTaskCollection("long",selectedDate).find(t=>t.id===id);if(!task)return;const rows=[["任务","日期","进展"],...Object.entries(task.progress||{}).filter(([,text])=>String(text).trim()).sort(([a],[b])=>a.localeCompare(b)).map(([date,text])=>[task.title,date,text])],safeName=task.title.replace(/[\\/:*?"<>|]/g,"-").slice(0,40)||"长期任务";downloadFile(`${safeName}-进展时间轴.csv`,`\ufeff${rows.map(row=>row.map(csvCell).join(",")).join("\r\n")}`,"text/csv;charset=utf-8")}
    function exportCsv(){const y=viewMonth.getFullYear(),m=viewMonth.getMonth(),last=new Date(y,m+1,0).getDate(),rows=[["日期","分类","状态","任务","说明","当日进展"]];for(let day=1;day<=last;day++){const d=new Date(y,m,day),key=toDateKey(d);if(d<earliestDate||d.getDay()===0||d.getDay()===6)continue;scopes.forEach(s=>getTasksForDate(s,d).forEach(t=>rows.push([key,scopeMeta[s].label,t.done?"已完成":"未完成",t.title,t.note||"",s==="long"?t.progress?.[key]||"":""])))}downloadFile(`工作日历-${y}-${pad(m+1)}.csv`,`\ufeff${rows.map(r=>r.map(csvCell).join(",")).join("\r\n")}`,"text/csv;charset=utf-8")}
    function exportJson(){const data={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key?.startsWith(`${storagePrefix}:`))data[key]=JSON.parse(localStorage.getItem(key))}downloadFile(`工作日历备份-${toDateKey(new Date())}.json`,JSON.stringify({app:"工作日历",version:2,exportedAt:new Date().toISOString(),earliestDate:earliestKey,data},null,2),"application/json;charset=utf-8")}
    async function importJsonFile(file){const input=document.querySelector("#importJsonInput");try{if(!file)return;if(file.size>10*1024*1024)throw new Error("备份文件超过 10 MB。");const backup=JSON.parse(await file.text());if(backup?.app!=="工作日历"||!backup.data||typeof backup.data!=="object"||Array.isArray(backup.data))throw new Error("这不是有效的工作日历备份。");const entries=Object.entries(backup.data).filter(([key])=>key.startsWith(`${storagePrefix}:`));if(!entries.length)throw new Error("备份中没有可导入的日历数据。");const hasExisting=Object.keys(localStorage).some(key=>key.startsWith(`${storagePrefix}:`));if(hasExisting&&!confirm("导入会覆盖当前浏览器中的同名日历记录。继续前建议先备份全部 JSON。\n\n确定继续吗？"))return;entries.forEach(([key,value])=>localStorage.setItem(key,JSON.stringify(value)));alert(`已导入 ${entries.length} 组日历数据。`);location.reload()}catch(error){alert(`导入失败：${error.message}`)}finally{input.value=""}}
    document.querySelector("#tabs").addEventListener("click",e=>{const t=e.target.closest("[data-filter]");if(t)setFilter(t.dataset.filter)});document.querySelector("#prevMonth").addEventListener("click",()=>moveMonth(-1));document.querySelector("#nextMonth").addEventListener("click",()=>moveMonth(1));document.querySelector("#prevDay").addEventListener("click",()=>selectDate(addWorkday(selectedDate,-1),true));document.querySelector("#nextDay").addEventListener("click",()=>selectDate(addWorkday(selectedDate,1),true));document.querySelector("#goToday").addEventListener("click",()=>selectDate(new Date(),true));picker.addEventListener("change",()=>selectDate(fromDateKey(picker.value),true));document.querySelector("#exportCsv").addEventListener("click",exportCsv);document.querySelector("#exportJson").addEventListener("click",exportJson);document.querySelector("#importJson").addEventListener("click",()=>document.querySelector("#importJsonInput").click());document.querySelector("#importJsonInput").addEventListener("change",e=>importJsonFile(e.target.files[0]));document.querySelector("#printCalendar").addEventListener("click",()=>window.print());
    document.querySelector("#addScope").addEventListener("change",updateAddFormMode);document.querySelector("#longTargetSelect").addEventListener("change",updateAddFormMode);
    document.querySelector("#addTaskForm").addEventListener("submit",e=>{e.preventDefault();const input=document.querySelector("#newTaskTitle"),noteInput=document.querySelector("#newTaskNote"),title=input.value.trim(),scope=activeFilter==="all"?document.querySelector("#addScope").value:activeFilter,note=scope==="today"?noteInput.value.trim():"";if(!title||!scopes.includes(scope))return;if(scope==="long"&&document.querySelector("#longTargetSelect").value!=="__new__"){const tasks=getTaskCollection("long",selectedDate),task=tasks.find(t=>t.id===document.querySelector("#longTargetSelect").value);if(!task)return;appendLongProgress(task,toDateKey(selectedDate),title);saveTaskCollection("long",selectedDate,tasks);expandedLongTaskIds.add(task.id)}else addTask(scope,selectedDate,title,note);input.value="";noteInput.value="";renderApp()});
    document.querySelectorAll('input[name="convertMode"]').forEach(input=>input.addEventListener("change",()=>{document.querySelector("#convertTarget").disabled=input.value!=="existing"||!input.checked}));
    document.querySelector("#convertForm").addEventListener("submit",e=>{e.preventDefault();if(!convertingTarget)return;const mode=document.querySelector('input[name="convertMode"]:checked').value,targetId=document.querySelector("#convertTarget").value;if(mode==="existing"&&!targetId){document.querySelector("#convertError").textContent="请选择一个已有长期任务。";return}const converted=convertTodayToLong(convertingTarget.id,fromDateKey(convertingTarget.dateKey),mode,targetId);if(converted)convertDialog.close()});document.querySelector("#cancelConvert").addEventListener("click",()=>convertDialog.close());convertDialog.addEventListener("close",()=>{convertingTarget=null});
    document.querySelector("#closeLongManager").addEventListener("click",()=>longManagerDialog.close());
    document.querySelector("#addPeriod").addEventListener("click",()=>{document.querySelector("#periodsEditor").insertAdjacentHTML("beforeend",periodRowMarkup());document.querySelector("#editError").textContent="";bindPeriodRemoveButtons()});
    document.querySelector("#editForm").addEventListener("submit",e=>{e.preventDefault();if(!editingTarget)return;const title=document.querySelector("#editTitle").value.trim(),note=document.querySelector("#editNote").value.trim(),error=document.querySelector("#editError");if(!title)return;let periods=[],weekdays=[];if(editingTarget.scope==="long"){periods=[...document.querySelectorAll("#periodsEditor .period-row")].map(row=>({startDate:row.querySelector(".period-start").value,endDate:row.querySelector(".period-end").value}));if(!periods.length||periods.some(p=>!p.startDate||!p.endDate||p.endDate<p.startDate)){error.textContent="请填写完整日期，且结束日期不能早于开始日期。";return}}if(editingTarget.scope==="weekly")weekdays=[...document.querySelectorAll("#weeklyDayFields input:checked")].map(input=>Number(input.value));editTask(editingTarget.scope,fromDateKey(editingTarget.dateKey),editingTarget.id,title,note,periods,weekdays);editDialog.close();renderApp()});document.querySelector("#cancelEdit").addEventListener("click",()=>editDialog.close());editDialog.addEventListener("close",()=>{editingTarget=null});ensureLongDateRanges();ensureRecurringDefinitions();renderApp();
  </script>
